<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread capability diagnostic 20261114-v1</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color-scheme:light dark}
body{margin:16px;max-width:740px}
h2{font-size:17px}dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px}
dt{opacity:.8}dd{margin:0;overflow-wrap:anywhere}
#status{border:1px solid #8888;border-radius:6px;padding:10px;white-space:pre-wrap}
</style></head><body>
<h2>Thread Host機能診断（表示専用）</h2>
<p>画面表示のみ。メッセージ送信・下書き作成・サーバー操作・外部通信なし。</p>
<dl>
<dt>ビルドID</dt><dd id="build">capdiag-20261114-v1</dd>
<dt>UIインスタンス</dt><dd id="instance"></dd>
<dt>生成UTC</dt><dd id="mounted"></dd>
<dt>初期化</dt><dd id="init">応答待ち</dd>
<dt>openai/message</dt><dd id="extended">不明（初期化待ち）</dd>
<dt>message.text</dt><dd id="messageText">不明（初期化待ち）</dd>
<dt>serverTools</dt><dd id="serverTools">不明（初期化待ち）</dd>
<dt>ホストコンテキスト</dt><dd id="context">未取得</dd>
<dt>ページ表示回数</dt><dd id="pages">0</dd>
<dt>可視性変更回数</dt><dd id="visibility">0</dd>
<dt>終了通知</dt><dd id="teardown">未受信</dd>
</dl>
<p id="status">UI初期化中</p>
<p><small>対応広告・ビルドID・UIインスタンスIDは、送信先のChatGPTチャットIDを認証するものではありません。</small></p>
<script>
(()=>{
 "use strict";
 const parent=window.parent;
 const show=(id,value)=>{document.getElementById(id).textContent=String(value)};
 const instance=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
 show("instance",instance);show("mounted",new Date().toISOString());
 const requestId="capdiag-init-"+instance;
 let initialized=false,teardown=false,pages=0,visibility=0;
 const has=(obj,key)=>Object.prototype.hasOwnProperty.call(obj,key);
 const validId=id=>(typeof id==="string"&&id.length>0&&id.length<=128)||
                    (typeof id==="number"&&Number.isSafeInteger(id)&&id>=0);
 const object=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
 const capability=(caps,key)=>{
   if(!object(caps))return "不明";
   if(!Object.prototype.hasOwnProperty.call(caps,key))return "広告なし";
   return object(caps[key])?"広告あり":"形式不正";
 };
 window.addEventListener("pageshow",()=>{if(!teardown)show("pages",++pages)});
 document.addEventListener("visibilitychange",()=>{if(!teardown)show("visibility",++visibility)});
 window.addEventListener("message",event=>{
   if(event.source!==parent||event.data?.jsonrpc!=="2.0")return;
   const msg=event.data;
   if(msg.method==="ui/resource-teardown"){
     if(teardown||has(msg,"result")||has(msg,"error")||
        (has(msg,"id")&&!validId(msg.id)))return;
     teardown=true;show("teardown","受信");show("status","終了済み。通信しません。");
     if(has(msg,"id"))parent.postMessage({jsonrpc:"2.0",id:msg.id,result:{}},"*");
     return;
   }
   // Accept an actual response only, and only for this UI mount's request.
   if(teardown||initialized||msg.id!==requestId||has(msg,"method")||
      has(msg,"result")===has(msg,"error"))return;
   initialized=true;
   const data=msg.result;
   if(msg.error||!object(data)||data.protocolVersion!=="2026-01-26"||
      !object(data.hostInfo)||typeof data.hostInfo.name!=="string"||
      typeof data.hostInfo.version!=="string"||
      !object(data.hostCapabilities)){
     show("init","エラー");show("status","初期化応答が不正です。送信しません。");
     return;
   }
   const caps=data.hostCapabilities;
   const validContainer=key=>!has(caps,key)||object(caps[key]);
   if(!validContainer("experimental")||!validContainer("message")||
      !validContainer("serverTools")||
      (has(caps,"experimental")&&has(caps.experimental,"openai/message")&&
        !object(caps.experimental["openai/message"]))||
      (has(caps,"message")&&has(caps.message,"text")&&!object(caps.message.text))){
     show("init","エラー");
     show("status","ホスト機能広告の形式が不正です。送信しません。");
     return;
   }
   const ext=has(caps,"experimental")?caps.experimental:{};
   const message=has(caps,"message")?caps.message:{};
   show("extended",capability(ext,"openai/message"));
   show("messageText",capability(message,"text"));
   show("serverTools",capability(caps,"serverTools"));
   const context=object(data.hostContext)?data.hostContext:{};
   show("context",Object.keys(context).filter(x=>x.length<=80).sort().slice(0,20).join(", ")||"なし");
   show("init","成功");
   show("status","機能広告の表示のみ。送信先・チャットIDは未検証です。");
   parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized"},"*");
 });
 parent.postMessage({jsonrpc:"2.0",id:requestId,method:"ui/initialize",
   params:{appInfo:{name:"Thread Host Capability Diagnostic",version:"1.0.0"},
    appCapabilities:{availableDisplayModes:["inline"]},protocolVersion:"2026-01-26"}},"*");
})();
</script></body></html>
