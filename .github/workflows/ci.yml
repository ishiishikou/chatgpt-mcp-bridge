name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python tests (offline; no production ledger)
        run: python -W error::ResourceWarning -m unittest -v test_dispatch_store.py
      - name: Assistant receipt storage tests (offline only)
        run: python -W error::ResourceWarning -m unittest -v test_response_receipts.py
      - name: MCP Apps simulated host (offline)
        run: node test-guarded-ui-offline.cjs
